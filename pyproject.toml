[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "convexedge"
version = "0.1.0"
description = "Permission-aware stock-option allocation and volatility forecasting"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=18,<24",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
ibkr = ["ibapi>=9.81"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

